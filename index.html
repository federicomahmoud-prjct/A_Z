<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BANDS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.2.3/css/flag-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #111111;
  --surface: #1c1c1c;
  --surface2: #222222;
  --border: rgba(255,255,255,0.07);
  --border-hover: rgba(255,255,255,0.16);
  --red: #c0392b;
  --red-dark: #8b0000;
  --red-dim: rgba(192,57,43,0.18);
  --red-border: rgba(192,57,43,0.35);
  --text: #d0d0d0;
  --text-muted: rgba(255,255,255,0.28);
  --text-dim: rgba(255,255,255,0.14);
  --radius: 8px;
  --header-h: 52px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; overflow: hidden; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(192,57,43,0.3); border-radius: 2px; }

/* HEADER */
#header {
  position: fixed; top: 0; left: 0; right: 0; height: var(--header-h);
  background: #161616; border-bottom: 1px solid rgba(192,57,43,0.2);
  display: flex; align-items: center; gap: 10px; padding: 0 14px; z-index: 100;
}
#logo { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: .1em; color: #e8e8e8; white-space: nowrap; cursor: pointer; user-select: none; }
#logo span { color: var(--red); }
#search-wrap { flex: 1; position: relative; max-width: 500px; }
#search-input {
  width: 100%; height: 32px; background: var(--surface); border: 0.5px solid var(--border);
  border-radius: 6px; color: var(--text); font-family: 'Inter', sans-serif;
  font-size: 13px; padding: 0 10px 0 32px; outline: none; transition: border-color .15s;
}
#search-input::placeholder { color: var(--text-muted); }
#search-input:focus { border-color: var(--red-border); }
#search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); pointer-events: none; }
#clear-search { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; line-height: 1; display: none; padding: 2px; }
#clear-search:hover { color: var(--text); }
#counter { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
#counter strong { color: var(--red); font-weight: 500; }
.tb-btn {
  width: 32px; height: 32px; border-radius: 6px; background: var(--surface); border: 0.5px solid var(--border);
  color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: border-color .15s, color .15s, background .15s;
}
.tb-btn:hover { border-color: var(--red-border); color: var(--text); }
.tb-btn.active { background: var(--red-dim); border-color: var(--red); color: #e88080; }
#btn-add {
  width: 32px; height: 32px; border-radius: 50%; background: var(--red-dark); border: 0.5px solid var(--red);
  color: #ffaaaa; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: background .15s, transform .15s; line-height: 1;
}
#btn-add:hover { background: var(--red); transform: scale(1.08); }

/* LAYOUT */
#app { height: 100vh; padding-top: var(--header-h); display: flex; flex-direction: column; overflow: hidden; }
#main-col { flex: 1; overflow-y: auto; display: flex; flex-direction: column; min-height: 0; }

/* FLAGS PANEL */
#flags-panel { background: #141414; border-bottom: 1px solid rgba(192,57,43,0.15); flex-shrink: 0; }
#flags-toggle-row {
  display: none; align-items: center; justify-content: space-between;
  padding: 8px 14px; cursor: pointer; user-select: none;
  border-bottom: 0.5px solid rgba(255,255,255,0.04);
}
#flags-toggle-row span:first-child { font-size: 11px; color: var(--text-dim); letter-spacing: .06em; text-transform: uppercase; }
#flags-toggle-icon { font-size: 11px; color: var(--text-muted); transition: transform .2s; }
#flags-panel-inner { padding: 10px 14px; }
#flags-panel.collapsed #flags-panel-inner { display: none; }
#flags-panel.collapsed #flags-toggle-icon { transform: rotate(-90deg); }

.flags-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, 38px);
  gap: 6px;
}
.flag-btn {
  width: 38px; height: 38px; background: var(--surface); border: 0.5px solid var(--border);
  border-radius: var(--radius); display: flex; align-items: center; justify-content: center;
  cursor: pointer; position: relative; flex-shrink: 0; transition: border-color .12s;
}
.flag-btn .fi { width: 24px; height: 18px; border-radius: 2px; display: block; }
.flag-btn.dimmed { filter: grayscale(100%) opacity(18%); pointer-events: none; }
.flag-btn:not(.dimmed):hover { border-color: var(--red); }
.flag-btn.active { background: rgba(139,0,0,0.3); border-color: var(--red); }
.flag-btn .tt {
  position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  background: #1a0505; border: 0.5px solid var(--red); border-radius: 5px; padding: 3px 8px;
  font-size: 11px; color: #e88080; white-space: nowrap;
  pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 30;
}
.flag-btn .tt::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 4px solid transparent; border-top-color: var(--red); }
.flag-btn:not(.dimmed):hover .tt { opacity: 1; }

/* LIST HEADER */
#list-header {
  background: #161616; border-bottom: 0.5px solid rgba(192,57,43,0.12);
  padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
#list-info { font-size: 11px; color: var(--text-dim); letter-spacing: .05em; text-transform: uppercase; }
#active-filter-chip {
  display: none; align-items: center; gap: 5px;
  background: var(--red-dim); border: 0.5px solid var(--red-border);
  border-radius: 4px; padding: 2px 8px; font-size: 11px; color: #e88080; cursor: pointer;
}
#active-filter-chip:hover { background: rgba(192,57,43,0.28); }
#active-filter-chip.visible { display: inline-flex; }

/* BAND LIST */
#band-list { padding: 10px 14px; }
.band-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; position: relative; }
.flag-box {
  width: 38px; height: 38px; flex-shrink: 0; background: var(--surface); border: 0.5px solid var(--border);
  border-radius: var(--radius); display: flex; align-items: center; justify-content: center;
  cursor: pointer; position: relative; transition: border-color .12s;
}
.flag-box .fi { width: 24px; height: 18px; border-radius: 2px; display: block; }
.flag-box:hover { border-color: var(--red); }
.flag-box .tt {
  position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  background: #1a0505; border: 0.5px solid var(--red); border-radius: 5px; padding: 3px 8px;
  font-size: 11px; color: #e88080; white-space: nowrap;
  pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 20;
}
.flag-box .tt::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border: 4px solid transparent; border-top-color: var(--red); }
.flag-box:hover .tt { opacity: 1; }
.name-box {
  flex: 1; height: 38px; background: var(--surface); border: 0.5px solid var(--border);
  border-radius: var(--radius); display: flex; align-items: center; padding: 0 12px;
  cursor: pointer; transition: background .12s, border-color .12s; min-width: 0;
}
.name-box:hover { background: #1f1414; border-color: rgba(192,57,43,0.35); }
.name-box span { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.band-actions { display: flex; gap: 4px; opacity: 0; transition: opacity .12s; }
.band-row:hover .band-actions { opacity: 1; }
.act-btn {
  width: 28px; height: 28px; border-radius: 5px; background: var(--surface2); border: 0.5px solid var(--border);
  color: var(--text-muted); cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center; transition: border-color .12s, color .12s;
}
.act-btn:hover { border-color: var(--red-border); color: #e88080; }
.act-btn.del:hover { border-color: #c0392b; color: #ff6b6b; }

/* EMPTY */
#empty-state { display: none; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; gap: 12px; color: var(--text-muted); text-align: center; }
#empty-state svg { opacity: .25; }
#empty-state p { font-size: 13px; }
#sentinel { height: 1px; }

/* STATS */
#stats-view { display: none; position: fixed; top: var(--header-h); left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 50; overflow-y: auto; padding: 20px; }
#stats-view.visible { display: block; }
#stats-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: .1em; color: #e8e8e8; margin-bottom: 16px; }
#stats-title span { color: var(--red); }
#chart-container { max-width: 700px; }
.bar-row-stat { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
.bar-nation { width: 140px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); justify-content: flex-end; }
.bar-nation .fi { width: 18px; height: 13px; border-radius: 2px; flex-shrink: 0; }
.bar-track { flex: 1; height: 20px; background: rgba(255,255,255,0.04); border-radius: 3px; overflow: hidden; cursor: pointer; transition: background .1s; }
.bar-track:hover { background: rgba(255,255,255,0.07); }
.bar-fill { height: 100%; background: var(--red-dark); border-radius: 3px; border-right: 1px solid var(--red); transition: width .4s ease; }
.bar-count { width: 36px; font-size: 12px; color: var(--text-muted); }
#stats-empty { font-size: 13px; color: var(--text-muted); display: none; }

/* MODAL */
#modal-overlay { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; }
#modal-overlay.open { display: flex; }
#modal { background: #181818; border: 0.5px solid rgba(192,57,43,0.35); border-radius: 10px; width: min(420px, calc(100vw - 32px)); padding: 24px; position: relative; }
#modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: .1em; color: #e8e8e8; margin-bottom: 18px; }
#modal-title span { color: var(--red); }
.form-group { margin-bottom: 14px; }
.form-label { display: block; font-size: 11px; color: var(--text-muted); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
.form-input, .form-select { width: 100%; height: 38px; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px; padding: 0 12px; outline: none; transition: border-color .15s; }
.form-input:focus, .form-select:focus { border-color: var(--red-border); }
.form-select { cursor: pointer; }
.form-select option { background: #1c1c1c; }
.modal-actions { display: flex; gap: 8px; margin-top: 20px; }
.btn-primary { flex: 1; height: 38px; border-radius: var(--radius); background: var(--red-dark); border: 0.5px solid var(--red); color: #ffaaaa; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: background .15s; }
.btn-primary:hover { background: var(--red); }
.btn-cancel { height: 38px; padding: 0 16px; border-radius: var(--radius); background: var(--surface); border: 0.5px solid var(--border); color: var(--text-muted); font-family: 'Inter', sans-serif; font-size: 13px; cursor: pointer; transition: border-color .15s; }
.btn-cancel:hover { border-color: var(--border-hover); }
#modal-close { position: absolute; top: 14px; right: 14px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 18px; line-height: 1; transition: color .12s; }
#modal-close:hover { color: var(--text); }
#modal-error { font-size: 12px; color: #e88080; margin-top: 8px; display: none; }

/* CONFIRM */
#confirm-overlay { display: none; position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; }
#confirm-overlay.open { display: flex; }
#confirm-box { background: #181818; border: 0.5px solid rgba(192,57,43,0.35); border-radius: 10px; width: min(340px, calc(100vw - 32px)); padding: 24px; }
#confirm-box p { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
#confirm-box strong { color: var(--text); }
.confirm-actions { display: flex; gap: 8px; }

/* FOOTER */
#footer { background: #161616; border-top: 0.5px solid var(--border); padding: 8px 14px; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.foot-btn { height: 28px; padding: 0 12px; border-radius: 5px; background: var(--surface); border: 0.5px solid var(--border); color: var(--text-muted); font-family: 'Inter', sans-serif; font-size: 11px; cursor: pointer; transition: border-color .15s, color .15s; }
.foot-btn:hover { border-color: var(--red-border); color: #e88080; }
#import-input { display: none; }
#footer-info { font-size: 11px; color: var(--text-dim); margin-left: auto; }

/* PLACEHOLDER XX */
.fi-xx { background: #2a2a2a !important; position: relative; border-radius: 2px; }
.fi-xx::after { content: '?'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; color: rgba(255,255,255,0.3); font-family: 'Inter', sans-serif; }

/* MOBILE */
@media (max-width: 600px) {
  #flags-toggle-row { display: flex; }
  .band-actions { opacity: 1; }
}
</style>
</head>
<body>

<header id="header">
  <div id="logo">BA<span>N</span>DS</div>
  <div id="search-wrap">
    <svg id="search-icon" width="13" height="13" viewBox="0 0 16 16" fill="none">
      <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5"/>
      <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <input id="search-input" type="text" placeholder="cerca una band...">
    <button id="clear-search">×</button>
  </div>
  <span id="counter"><strong>0</strong> band</span>
  <button class="tb-btn" id="btn-stats" title="Statistiche">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
      <rect x="1" y="8" width="3" height="7" rx="1" fill="currentColor"/>
      <rect x="6" y="5" width="3" height="10" rx="1" fill="currentColor"/>
      <rect x="11" y="2" width="3" height="13" rx="1" fill="currentColor"/>
    </svg>
  </button>
  <button id="btn-add" title="Aggiungi band">+</button>
</header>

<div id="app">
  <div id="main-col">

    <div id="flags-panel">
      <div id="flags-toggle-row">
        <span id="flags-toggle-label">nazioni</span>
        <span id="flags-toggle-icon">▾</span>
      </div>
      <div id="flags-panel-inner">
        <div class="flags-grid" id="flags-grid"></div>
      </div>
    </div>

    <div id="list-header">
      <span id="list-info">tutte le band</span>
      <span id="active-filter-chip">
        <span id="chip-flag"></span>
        <span id="chip-name"></span>
        <span>·</span>
        <span id="chip-count"></span>
        <span style="margin-left:4px;opacity:.6">✕</span>
      </span>
    </div>

    <div id="band-list"></div>
    <div id="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.2"/>
        <path d="M8 12h8M12 8v8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      <p id="empty-msg">Nessuna band trovata</p>
    </div>
    <div id="sentinel"></div>

    <div id="footer">
      <button class="foot-btn" id="btn-export">↓ Backup JSON</button>
      <button class="foot-btn" id="btn-import">↑ Importa JSON</button>
      <input type="file" id="import-input" accept=".json">
      <span id="footer-info">localStorage</span>
    </div>
  </div>
</div>

<div id="stats-view">
  <div id="stats-title">STATI<span>STICHE</span></div>
  <div id="chart-container"></div>
  <p id="stats-empty">Nessuna band nel database.</p>
</div>

<div id="modal-overlay">
  <div id="modal">
    <button id="modal-close">×</button>
    <div id="modal-title">NUOVA <span>BAND</span></div>
    <div class="form-group">
      <label class="form-label" for="f-name">Nome band</label>
      <input class="form-input" id="f-name" type="text" placeholder="es. Iron Maiden" autocomplete="off">
    </div>
    <div class="form-group">
      <label class="form-label" for="f-country">Nazione</label>
      <select class="form-select" id="f-country"></select>
    </div>
    <p id="modal-error">Campo obbligatorio mancante.</p>
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">Annulla</button>
      <button class="btn-primary" id="modal-save">Salva</button>
    </div>
  </div>
</div>

<div id="confirm-overlay">
  <div id="confirm-box">
    <p>Eliminare <strong id="confirm-name"></strong>?</p>
    <div class="confirm-actions">
      <button class="btn-cancel" id="confirm-cancel">Annulla</button>
      <button class="btn-primary" id="confirm-ok" style="background:#7a0000;border-color:#c0392b;">Elimina</button>
    </div>
  </div>
</div>

const isoToCountry = {};
COUNTRIES.forEach(c => isoToCountry[c.iso] = c);

let db = [];
let filteredISO = null;
let searchQuery = '';
let editingId = null;
let confirmCb = null;
let renderOffset = 0;
const PAGE = 40;

function save() {
  localStorage.setItem('bands_db', JSON.stringify(db));
  renderFlagsGrid();
  updateCounter();
}
function load() {
  try { const r = localStorage.getItem('bands_db'); if (r) db = JSON.parse(r); } catch(e) { db = []; }
}
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

function getFiltered() {
  let list = db;
  if (filteredISO) list = list.filter(b => b.iso === filteredISO);
  if (searchQuery) { const q = searchQuery.toLowerCase(); list = list.filter(b => b.name.toLowerCase().includes(q)); }
  return list.sort((a,b) => a.name.localeCompare(b.name));
}

function renderFlagsGrid() {
  const grid = document.getElementById('flags-grid');
  const counts = {};
  db.forEach(b => { counts[b.iso] = (counts[b.iso] || 0) + 1; });

  if (grid.children.length !== COUNTRIES.length) {
    grid.innerHTML = '';
    COUNTRIES.forEach(c => {
      const btn = document.createElement('div');
      btn.className = 'flag-btn';
      btn.dataset.iso = c.iso;
      btn.innerHTML = `<span class="fi fi-${c.iso.toLowerCase()}"></span><div class="tt">${c.name}</div>`;
      btn.addEventListener('click', () => { if (!btn.classList.contains('dimmed')) setFilter(c.iso); });
      grid.appendChild(btn);
    });
  }

  Array.from(grid.children).forEach(btn => {
    const iso = btn.dataset.iso;
    btn.classList.toggle('dimmed', !counts[iso]);
    btn.classList.toggle('active', filteredISO === iso);
  });
}

function renderList(reset = true) {
  if (reset) renderOffset = 0;
  const list = getFiltered();
  const el = document.getElementById('band-list');
  const empty = document.getElementById('empty-state');
  if (reset) el.innerHTML = '';

  if (list.length === 0) {
    empty.style.display = 'flex';
    document.getElementById('empty-msg').textContent =
      searchQuery ? `Nessun risultato per "${searchQuery}"` : 'Nessuna band. Aggiungine una!';
    updateListHeader(0);
    return;
  }
  empty.style.display = 'none';

  const chunk = list.slice(renderOffset, renderOffset + PAGE);
  chunk.forEach(band => {
    const c = isoToCountry[band.iso];
    const cname = c ? c.name : band.iso;
    const isoL = band.iso.toLowerCase();
    const row = document.createElement('div');
    row.className = 'band-row';
    row.dataset.id = band.id;
    row.innerHTML = `
      <div class="flag-box" data-iso="${band.iso}">
        <span class="fi fi-${isoL}"></span>
        <div class="tt">${cname}</div>
      </div>
      <div class="name-box"><span>${escHtml(band.name)}</span></div>
      <div class="band-actions">
        <button class="act-btn edit" title="Modifica">✎</button>
        <button class="act-btn del" title="Elimina">✕</button>
      </div>`;
    row.querySelector('.flag-box').addEventListener('click', () => setFilter(band.iso));
    row.querySelector('.name-box').addEventListener('click', () => openEdit(band.id));
    row.querySelector('.edit').addEventListener('click', e => { e.stopPropagation(); openEdit(band.id); });
    row.querySelector('.del').addEventListener('click', e => { e.stopPropagation(); confirmDelete(band.id, band.name); });
    el.appendChild(row);
  });
  renderOffset += chunk.length;
  updateListHeader(list.length);
}

function loadMore() {
  if (renderOffset >= getFiltered().length) return;
  renderList(false);
}

const observer = new IntersectionObserver(entries => { if (entries[0].isIntersecting) loadMore(); }, { rootMargin: '200px' });
observer.observe(document.getElementById('sentinel'));

function updateListHeader(count) {
  const chip = document.getElementById('active-filter-chip');
  if (filteredISO) {
    const c = isoToCountry[filteredISO];
    const name = c ? c.name : filteredISO;
    document.getElementById('chip-flag').innerHTML = `<span class="fi fi-${filteredISO.toLowerCase()}" style="width:16px;height:12px;border-radius:1px;display:inline-block;vertical-align:middle"></span>`;
    document.getElementById('chip-name').textContent = name;
    document.getElementById('chip-count').textContent = count;
    chip.classList.add('visible');
    document.getElementById('list-info').textContent = 'filtro attivo';
  } else {
    chip.classList.remove('visible');
    document.getElementById('list-info').textContent = searchQuery ? `${count} risultati` : 'tutte le band';
  }
}

function updateCounter() {
  document.getElementById('counter').innerHTML = `<strong>${db.length}</strong> band`;
  document.getElementById('footer-info').textContent = `${db.length} band · localStorage`;
}

function setFilter(iso) {
  filteredISO = filteredISO === iso ? null : iso;
  renderFlagsGrid();
  renderList();
}

document.getElementById('active-filter-chip').addEventListener('click', () => {
  filteredISO = null; renderFlagsGrid(); renderList();
});

let statsVisible = false;
document.getElementById('btn-stats').addEventListener('click', () => {
  statsVisible = !statsVisible;
  document.getElementById('stats-view').classList.toggle('visible', statsVisible);
  document.getElementById('btn-stats').classList.toggle('active', statsVisible);
  if (statsVisible) renderStats();
});

function renderStats() {
  const container = document.getElementById('chart-container');
  const emptyMsg = document.getElementById('stats-empty');
  container.innerHTML = '';
  if (db.length === 0) { emptyMsg.style.display = 'block'; return; }
  emptyMsg.style.display = 'none';
  const counts = {};
  db.forEach(b => { counts[b.iso] = (counts[b.iso] || 0) + 1; });
  const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0,40);
  const max = sorted[0][1];
  sorted.forEach(([iso, count]) => {
    const c = isoToCountry[iso];
    const name = c ? c.name : iso;
    const pct = Math.round((count / max) * 100);
    const row = document.createElement('div');
    row.className = 'bar-row-stat';
    row.innerHTML = `
      <div class="bar-nation"><span>${name}</span><span class="fi fi-${iso.toLowerCase()}"></span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <span class="bar-count">${count}</span>`;
    row.querySelector('.bar-track').addEventListener('click', () => {
      statsVisible = false;
      document.getElementById('stats-view').classList.remove('visible');
      document.getElementById('btn-stats').classList.remove('active');
      setFilter(iso);
    });
    container.appendChild(row);
  });
}

function buildSelect() {
  const sel = document.getElementById('f-country');
  sel.innerHTML = '';
  COUNTRIES.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.iso; opt.textContent = c.name;
    sel.appendChild(opt);
  });
}

function openAdd() {
  editingId = null;
  document.getElementById('modal-title').innerHTML = 'NUOVA <span>BAND</span>';
  document.getElementById('f-name').value = '';
  document.getElementById('f-country').value = 'IT';
  document.getElementById('modal-error').style.display = 'none';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 50);
}

function openEdit(id) {
  const band = db.find(b => b.id === id);
  if (!band) return;
  editingId = id;
  document.getElementById('modal-title').innerHTML = 'MODIFICA <span>BAND</span>';
  document.getElementById('f-name').value = band.name;
  document.getElementById('f-country').value = band.iso;
  document.getElementById('modal-error').style.display = 'none';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('f-name').focus(), 50);
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); editingId = null; }

function saveBand() {
  const name = document.getElementById('f-name').value.trim();
  const iso = document.getElementById('f-country').value;
  if (!name || !iso) { document.getElementById('modal-error').style.display = 'block'; return; }
  document.getElementById('modal-error').style.display = 'none';
  if (editingId) {
    const idx = db.findIndex(b => b.id === editingId);
    if (idx !== -1) { db[idx].name = name; db[idx].iso = iso; }
  } else {
    db.push({ id: genId(), name, iso });
  }
  save(); renderList(); closeModal();
}

document.getElementById('btn-add').addEventListener('click', openAdd);
document.getElementById('modal-save').addEventListener('click', saveBand);
document.getElementById('modal-cancel').addEventListener('click', closeModal);
document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target === document.getElementById('modal-overlay')) closeModal(); });
document.getElementById('f-name').addEventListener('keydown', e => { if (e.key === 'Enter') saveBand(); if (e.key === 'Escape') closeModal(); });

function confirmDelete(id, name) {
  document.getElementById('confirm-name').textContent = name;
  document.getElementById('confirm-overlay').classList.add('open');
  confirmCb = () => { db = db.filter(b => b.id !== id); save(); renderList(); };
}
document.getElementById('confirm-ok').addEventListener('click', () => {
  if (confirmCb) confirmCb(); confirmCb = null;
  document.getElementById('confirm-overlay').classList.remove('open');
});
document.getElementById('confirm-cancel').addEventListener('click', () => {
  confirmCb = null; document.getElementById('confirm-overlay').classList.remove('open');
});
document.getElementById('confirm-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('confirm-overlay')) { confirmCb = null; document.getElementById('confirm-overlay').classList.remove('open'); }
});

document.getElementById('search-input').addEventListener('input', e => {
  searchQuery = e.target.value;
  document.getElementById('clear-search').style.display = searchQuery ? 'block' : 'none';
  renderList();
});
document.getElementById('clear-search').addEventListener('click', () => {
  searchQuery = ''; document.getElementById('search-input').value = '';
  document.getElementById('clear-search').style.display = 'none'; renderList();
});

document.getElementById('logo').addEventListener('click', () => {
  filteredISO = null; searchQuery = '';
  document.getElementById('search-input').value = '';
  document.getElementById('clear-search').style.display = 'none';
  renderFlagsGrid(); renderList();
});

document.getElementById('flags-toggle-row').addEventListener('click', () => {
  const panel = document.getElementById('flags-panel');
  panel.classList.toggle('collapsed');
  document.getElementById('flags-toggle-label').textContent =
    panel.classList.contains('collapsed') ? 'mostra nazioni' : 'nazioni';
});

document.getElementById('btn-export').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'bands_backup_' + new Date().toISOString().slice(0,10) + '.json'; a.click();
});
document.getElementById('btn-import').addEventListener('click', () => document.getElementById('import-input').click());
document.getElementById('import-input').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      if (!Array.isArray(imported)) throw new Error();
      db = imported; save(); filteredISO = null; searchQuery = '';
      document.getElementById('search-input').value = '';
      renderFlagsGrid(); renderList();
    } catch(err) { alert('File JSON non valido.'); }
  };
  reader.readAsText(file); e.target.value = '';
});

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

load();
buildSelect();
renderFlagsGrid();
updateCounter();
renderList();
</script>
